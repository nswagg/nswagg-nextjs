name: Dependency and application checks

on:
  pull_request:
  push:
    branches: ['codex/**', 'develop', 'v2.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify audit policy, dependencies, lint, build, and production smoke checks
        run: npm run verify
